{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="logo">
        <h1>ROCK<span>!</span></h1>
    </div>
    
    <h2>Авторизация</h2>
    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-login">Войти</button>
    </form>

</div>
{% endblock %}
